<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Notch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="shell">
  <!-- ===== Barra (franja reservada) ===== -->
  <div id="bar">
    <div class="bar-side bar-left">
      <button class="bar-btn bar-label" id="barLabel" data-open-view="system" title="Carpetas, apps y energía"></button>
      <div class="bar-win" id="barWin"><img id="barWinIcon" alt=""><span id="barWinTitle"></span></div>
    </div>
    <div class="bar-side bar-right">
      <button class="bar-btn bar-media" id="barMedia" title="Reproducir / pausar"><img id="barArt" alt=""><span id="barMediaTxt"></span></button>
      <button class="bar-btn bar-stats" id="barStats" data-open-view="stats" title="Sistema"></button>
      <button class="bar-btn" id="barNet" data-open-view="stats" title="Red"></button>
      <div class="bar-tray" id="barTray"></div>
      <button class="bar-btn" id="barVol" title="Volumen (rueda para cambiar, clic para silenciar)"></button>
      <button class="bar-btn bar-lang" id="barLang" title="Cambiar idioma del teclado"></button>
    </div>
  </div>

  <!-- Desplegable bajo el volumen: salidas de audio (clic) o mezclador (clic derecho) -->
  <div id="pop" class="pop" hidden></div>

  <div id="island" class="island">
    <span class="ear ear-l"></span><span class="ear ear-r"></span>
    <span class="tongue tongue-l"><svg viewBox="0 0 22 9" preserveAspectRatio="none"><path d="M0,0 C11,0 10,9 22,9 L22,0 Z"/></svg></span><span class="tongue tongue-mid"></span><span class="tongue tongue-r"><svg viewBox="0 0 22 9" preserveAspectRatio="none"><path d="M0,0 C11,0 10,9 22,9 L22,0 Z"/></svg></span>

    <!-- ===== Compacto ===== -->
    <div class="compact" id="compact">
      <div class="c-left" id="cLeft"></div>
      <div class="c-clock" id="cClock"><span class="c-date" id="cDate"></span><span class="c-time" id="cTime"></span></div>
      <div class="c-right" id="cRight"><canvas id="miniViz" width="64" height="40"></canvas></div>
    </div>

    <!-- ===== Expandido ===== -->
    <div class="expanded" id="expanded">
      <header class="x-head">
        <button class="chip home" data-view="system" title="Carpetas, apps y energía"><span id="label"></span><i data-icon="chevron"></i></button>
        <div class="active-win" id="activeWin"><img id="activeIcon" alt=""><span id="activeTitle"></span></div>
        <nav class="tabs">
          <button class="tab" data-view="search" title="Buscar apps, juegos y archivos"><i data-icon="search"></i></button>
          <button class="tab" data-view="main" title="Inicio"><i data-icon="home"></i></button>
          <button class="tab" data-view="stats" title="Sistema"><i data-icon="cpu"></i></button>
          <button class="tab" data-view="tray" title="Bandeja del sistema"><i data-icon="grid"></i></button>
          <button class="tab" data-view="tasks" title="Tareas y recordatorios"><i data-icon="list"></i><span class="badge" id="taskBadge"></span></button>
          <button class="tab" data-view="claude" title="Claude Code"><i data-icon="claude"></i><span class="badge" id="ccBadge"></span></button>
        </nav>
        <button class="chip" id="langBtn" data-view="lang" title="Idioma del teclado"></button>
      </header>

      <!-- Inicio -->
      <!-- Buscador -->
      <section class="view" data-name="search">
        <div class="ls-box"><i data-icon="search"></i><input id="lsInput" placeholder="Buscar apps, juegos y archivos" autocomplete="off" spellcheck="false"><span class="ls-key" id="lsKey"></span></div>
        <div class="ls-list" id="lsList"></div>
        <div class="ls-hint">&uarr;&darr; elegir &middot; Enter abrir &middot; Ctrl+Enter abrir su carpeta &middot; Esc cerrar</div>
      </section>

      <section class="view" data-name="main">
        <div class="perm-host" id="permMain"></div>
        <div class="grid">
          <div class="card media" id="mediaCard">
            <canvas id="bigViz" class="big-viz" width="400" height="120"></canvas>
            <div class="m-top">
              <div class="m-art" id="mArt"><i data-icon="music"></i></div>
              <div class="m-meta">
                <div class="m-title" id="mTitle">Nada sonando</div>
                <div class="m-artist" id="mArtist">Pon algo de música</div>
                <div class="m-app" id="mApp"></div>
              </div>
            </div>
            <div class="m-progress" id="mProgress">
              <span id="mPos">0:00</span>
              <div class="bar" id="mBar"><div class="fill" id="mFill"></div><div class="knob" id="mKnob"></div></div>
              <span id="mDur">0:00</span>
            </div>
            <div class="m-controls">
              <button class="icon-btn lg" id="mPrev" title="Anterior"><i data-icon="prev"></i></button>
              <button class="icon-btn xl play" id="mPlay" title="Reproducir / pausar"><i data-icon="play"></i></button>
              <button class="icon-btn lg" id="mNext" title="Siguiente"><i data-icon="next"></i></button>
            </div>
          </div>

          <div class="card cal" id="calCard">
            <div class="cal-head">
              <div>
                <div class="big-time" id="bigTime"></div>
                <div class="big-date" id="bigDate"></div>
              </div>
              <div class="cal-nav">
                <button class="icon-btn sm" id="calPrev"><i data-icon="left"></i></button>
                <button class="cal-month" id="calMonth"></button>
                <button class="icon-btn sm" id="calNext"><i data-icon="right"></i></button>
              </div>
            </div>
            <div class="cal-grid" id="calGrid"></div>
          </div>
        </div>

        <div class="controls">
          <div class="sliders">
            <div class="slider-row">
              <button class="icon-btn" id="volMute" title="Silenciar"><i data-icon="vol"></i></button>
              <input type="range" id="volRange" min="0" max="100" step="1">
              <span class="pct" id="volPct"></span>
            </div>
            <div class="slider-row">
              <button class="icon-btn" id="micMute" title="Silenciar micrófono"><i data-icon="mic"></i></button>
              <input type="range" id="micRange" min="0" max="100" step="1">
              <span class="pct" id="micPct"></span>
            </div>
          </div>
          <div class="actions">
            <button class="action" data-uri="ms-screenclip:"><i data-icon="shot"></i><span>Captura</span></button>
            <button class="action" id="themeBtn"><i data-icon="moon"></i><span>Tema</span></button>
            <button class="action" data-view="power"><i data-icon="bolt"></i><span id="planLabel">Energía</span></button>
            <button class="action" id="quickTask"><i data-icon="alarm"></i><span>Recordar</span></button>
          </div>
        </div>
      </section>

      <!-- Sistema (datos del agente del home-dashboard) -->
      <section class="view" data-name="stats">
        <div class="stats" id="stats"></div>
      </section>

      <!-- Tareas / recordatorios (data.json del home-dashboard) -->
      <section class="view" data-name="tasks">
        <form class="task-form" id="taskForm" autocomplete="off">
          <input type="text" id="taskText" placeholder="Nueva tarea o recordatorio…" maxlength="300">
          <input type="datetime-local" id="taskDue" title="Fecha y hora del aviso (opcional)">
          <button type="submit" class="icon-btn add" title="Añadir"><i data-icon="plus"></i></button>
        </form>
        <div class="quick-due" id="quickDue">
          <button type="button" data-in="15">+15 min</button>
          <button type="button" data-in="60">+1 h</button>
          <button type="button" data-in="tonight">Esta noche</button>
          <button type="button" data-in="tomorrow">Mañana 9:00</button>
          <button type="button" data-in="none">Sin aviso</button>
        </div>
        <div class="tasks" id="tasks"></div>
      </section>

      <!-- Bandeja del sistema -->
      <section class="view" data-name="tray">
        <div class="tray-grid" id="trayGrid"></div>
        <div class="tray-hint">Clic: abrir · doble clic · clic derecho: menú de la app · <b>chincheta</b>: fijar el icono en la barra · <a href="#" id="trayRescan">¿Falta alguno? Actualizar</a></div>
      </section>

      <!-- Claude Code -->
      <section class="view" data-name="claude">
        <div class="perm-host" id="permList"></div>
        <div class="ask">
          <div class="ask-log" id="askLog"></div>
          <form class="ask-form" id="askForm" autocomplete="off">
            <i data-icon="claude"></i>
            <input type="text" id="askText" placeholder="Pregúntale a Claude…" maxlength="4000">
            <button type="button" class="icon-btn sm" id="askClear" title="Nueva conversación"><i data-icon="restart"></i></button>
            <button type="submit" class="icon-btn add" title="Enviar"><i data-icon="send"></i></button>
          </form>
        </div>
        <div class="claude" id="claudeList"></div>
      </section>

      <!-- Idioma -->
      <section class="view" data-name="lang">
        <div class="sub-head"><button class="icon-btn" data-view="main"><i data-icon="left"></i></button><span>Idioma del teclado</span></div>
        <div class="tiles" id="langTiles"></div>
      </section>

      <!-- Carpetas y sistema -->
      <section class="view" data-name="system">
        <div class="sub-head"><button class="icon-btn" data-view="main"><i data-icon="left"></i></button><span>Carpetas y apps</span></div>
        <div class="tiles" id="folderTiles"></div>
        <div class="tiles">
          <button class="tile" data-uri="ms-settings:"><i data-icon="gear"></i><span>Configuración</span></button>
          <button class="tile" data-launch="taskmgr"><i data-icon="chart"></i><span>Administrador de tareas</span></button>
          <button class="tile" data-launch="terminal"><i data-icon="term"></i><span>Terminal</span></button>
          <button class="tile" data-launch="explorer"><i data-icon="folder"></i><span>Explorador</span></button>
          <button class="tile" data-view="power"><i data-icon="power"></i><span>Energía</span></button>
        </div>
      </section>

      <!-- Energía -->
      <section class="view" data-name="power">
        <div class="sub-head"><button class="icon-btn" data-view="main"><i data-icon="left"></i></button><span>Energía</span></div>
        <div class="tiles power">
          <button class="tile" data-power="lock"><i data-icon="lock"></i><span>Bloquear</span></button>
          <button class="tile" data-power="sleep"><i data-icon="moon"></i><span>Suspender</span></button>
          <button class="tile" data-power="signout"><i data-icon="out"></i><span>Cerrar sesión</span></button>
          <button class="tile danger" data-power="restart"><i data-icon="restart"></i><span>Reiniciar</span></button>
          <button class="tile danger" data-power="shutdown"><i data-icon="power"></i><span>Apagar</span></button>
        </div>
        <div class="plan-title">Plan de energía</div>
        <div class="plans" id="plans"></div>
      </section>
    </div>
  </div>
  </div><!-- /shell -->
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
